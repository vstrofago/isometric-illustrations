name: Release

on:
  push:
    tags: ['v*']
  # Or run it by hand: it creates the tag on the commit it runs on.
  workflow_dispatch:
    inputs:
      version:
        description: Tag to create and release, e.g. v0.1.0 (must match package.json)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish a GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run validate:skill

      - name: Package the skill
        run: tools/install-skill.sh --zip

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$TAG" = "$want" ] || { echo "::error::tag $TAG does not match package.json ($want)"; exit 1; }
          assets="dist/isometric-illustrations.zip dist/iso.js dist/iso.min.js dist/iso.esm.js"
          # a release drafted by hand on GitHub gets the built assets attached (replacing uploads)
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" $assets --clobber; exit 0; fi
          if [ "$EVENT" = workflow_dispatch ]; then where="--target $GITHUB_SHA"; else where="--verify-tag"; fi
          gh release create "$TAG" $assets \
            --title "Iso $TAG" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md). Assets: the agent skill (isometric-illustrations.zip) and the engine bundles." \
            $where
