name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the bundle
        run: npm run build

      - name: The committed bundle matches the sources
        run: git diff --exit-code -- dist skills/isometric-illustrations/assets/iso.js

      - name: Validate the skill and plugin manifests
        run: npm run validate:skill

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit and visual tests
        run: npm test

      - name: Upload renders on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-renders
          path: out/visual
          if-no-files-found: ignore
