<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Iso · launch card</title>
<style>
  /* 1920 × 1080 card for the launch video. ?end adds the repository address. */
  html,body{margin:0;background:#151618}
  #frame{position:relative;width:1920px;height:1080px;overflow:hidden;background:#151618;color:#ecebe6;font-family:"Geist Mono",ui-monospace,"DejaVu Sans Mono",Menlo,monospace}
  #stage{position:absolute;left:0;right:0;top:130px;height:720px}
  .url{position:absolute;left:0;right:0;bottom:150px;margin:0;text-align:center;font-size:44px;letter-spacing:.01em;display:none}
  .end #stage{top:70px}
  .end .url{display:block}
</style>
</head>
<body>
<div id="frame">
  <div id="stage"></div>
  <p class="url">github.com/vstrofago/isometric-illustrations</p>
</div>
<script src="../../dist/iso.js"></script>
<script>
if (/[?&]end\b/.test(location.search)) document.getElementById('frame').classList.add('end');
const s = Iso.scene('#stage', { height: 720, padding: 16, label: 'The word ISO built from cubes on a platform' });
s.platform({ size: [300, 150], screws: true });
/* pixel letters standing on the platform, facing screen-left */
const GLYPHS = {
  I: ['###', '.#.', '.#.', '.#.', '###'],
  S: ['####', '#...', '####', '...#', '####'],
  O: ['.##.', '#..#', '#..#', '#..#', '.##.'],
};
const C = 13, G = 1.6;
let col = 0;
const cubes = [];
for (const ch of 'ISO') {
  const g = GLYPHS[ch];
  g.forEach((row, r) => [...row].forEach((px, c) => {
    if (px !== '#') return;
    const x = -92 + (col + c) * C, z = (4 - r) * C;
    cubes.push(s.box({ class: 'px', at: [x, -2, z], size: [C - G, C - G, C - G], r: 1.2, chamfer: 0.8, opacity: 1 }));
  }));
  col += g[0].length + 1;
}
s.card({ id: 'card', at: [80, 46, 0], w: 22, d: 14 });
s.float('card', { amp: 5, period: 2.4 });
s.timeline({ delay: 0.2 }).from(cubes, { z: 60, opacity: 0 }, { duration: 0.7, ease: 'out', stagger: { each: 0.035, from: 'start' } });
s.timeline({ delay: 1.6 }).from(['card'], { opacity: 0 }, { duration: 0.5 });
</script>
</body>
</html>
