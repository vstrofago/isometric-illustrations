<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service architecture</title>
<style>
  html,body{margin:0;background:#0b0c0d}
  main{max-width:1100px;margin:0 auto;padding:24px 16px}
</style>
</head>
<body>
<main id="app"></main>
<script src="../dist/iso.js"></script>
<script>
/* Fig. 4 — Service architecture. A diagram from data: five services on a grid, straight edges with
   flowing dashes and packets. Hover a service to raise it and read its role. */
const s = Iso.scene('#app', {
  figure: { index: 'Fig. 4', title: 'Service architecture', hint: 'Hover a service', status: 'requests flowing' },
  label: 'Isometric architecture diagram: clients send requests to an API, which writes to a database and queues jobs for a worker',
  padding: 30,
});

s.platform({ size: [330, 250], inset: 12 });

const roles = {
  clients: 'Clients · web and mobile', api: 'API · routes and auth', db: 'Postgres · primary',
  queue: 'Queue · at-least-once', worker: 'Worker · emails and invoices',
};

const d = s.diagram({
  grid: 100, origin: [-100, -50], nodeSize: 38, speed: 44,
  nodes: [
    { id: 'clients', cell: [0, 0], icon: 'users', label: 'Clients' },
    { id: 'api', cell: [1, 0], icon: 'server', label: 'API', size: [42, 42, 16], material: 'lit', glow: true },
    { id: 'db', cell: [2, 0], type: 'database', r: 17, tiers: 3, tierH: 7 },
    { id: 'queue', cell: [1, 1], icon: 'queue', label: 'Queue' },
    { id: 'worker', cell: [2, 1], icon: 'cpu', label: 'Worker' },
  ],
  edges: [
    { from: 'clients', to: 'api', packets: 2 },
    { from: 'api', to: 'db', packets: 1 },
    { from: 'api', to: 'queue', packets: 1 },
    { from: 'queue', to: 'worker', packets: 1 },
  ],
});

/* hover: raise the service and say what it does */
for (const [id, node] of d.nodesById) {
  node.set('label', roles[id]);
  node.on('hover', () => { s.to(node, { z: 6 }, { duration: 0.22 }); s.status(roles[id].toLowerCase()); });
  node.on('leave', () => { s.to(node, { z: 0 }, { duration: 0.22 }); s.status('requests flowing'); });
}

s.assemble([...d.nodesById.values()], { stagger: 0.08, drop: 30 });
s.drawOn(d.edges.map((e) => e.line), { delay: 0.7, duration: 0.7, stagger: 0.15 });
</script>
</body>
</html>
