<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ring campus</title>
<style>
  html,body{margin:0;background:#0b0c0d}
  main{max-width:1180px;margin:0 auto;padding:24px 16px}
</style>
</head>
<body>
<main id="app"></main>
<script src="../dist/iso.js"></script>
<script>
/* Fig. 3 — Ring campus. A diorama: lit cards travel along the roof; every phone they pass rises to meet
   them. Devices leave through the glass gate on the right. Click to pause. */
const s = Iso.scene('#app', {
  figure: { index: 'Fig. 3', title: 'Ring campus', hint: 'Click to pause', status: 'live' },
  label: 'Isometric diorama of a ring-shaped campus with a wooded courtyard, devices on the roof and a glass gate',
  padding: 18,
});
const R = Iso.rng(7);
const RING = { r: 165, ri: 124, h: 22 }, LANE = 145, ROOF = RING.h;

/* ground */
s.platform({ size: [620, 520], label: 'Ring campus · Fig. 3 · 2026', screws: true });
s.box({ at: [300, 70, -10], size: [110, 96, 10], r: 8, chamfer: 3 });                       // deck for the gate
s.ring({ at: [0, 0, 0], r: 202, ri: 186, fill: 'f-road', line: 'ln-soft' });                 // ring road
s.circle({ at: [0, 0, 0], r: 194, line: 'ln-faint', dash: '3 5' });

/* courtyard: a pond, a path and a wood */
const pond = [34, 36];
s.circle({ at: [pond[0], pond[1], 0], r: 27, fill: 'f-dark', line: 'ln-soft' });
for (const rr of [20, 13, 6]) s.circle({ at: [pond[0], pond[1], 0], r: rr, line: 'ln-faint' });
const trail = Iso.path.bezier([-118, -24, 0], [-40, -78, 0], [10, 92, 0], [112, 22, 0]);
s.ribbon({ path: trail, width: 9, fill: 'f-road' });
s.box({ center: [-36, -6, 0], size: [26, 16, 7], r: 2, chamfer: 1, top: (f) => f.hlines(4, 4, 18, 8, 4, 'ln-faint') });
const nearTrail = (x, y) => trail.points.some((p) => Math.hypot(p[0] - x, p[1] - y) < 11);
s.forest({ ring: [8, 116], count: 150, spacing: 9.5, seed: 4, kinds: ['tiered', 'tiered', 'pine'], minScale: 0.65, maxScale: 1.05,
  avoid: (x, y) => Math.hypot(x - pond[0], y - pond[1]) < 33 || nearTrail(x, y) || (Math.abs(x + 36) < 20 && Math.abs(y + 6) < 14) });

/* the ring */
s.tube({ id: 'ring', at: [0, 0, 0], r: RING.r, ri: RING.ri, h: RING.h, segments: 24, bands: [7.5, 14.5], ribs: 150, innerBands: [7.5, 14.5], topRings: [LANE - 6, LANE + 6] });

/* outside: trees, a plaza, offices, solar field, parking */
const free = (x, y) => {
  const d = Math.hypot(x, y);
  if (d < 214) return false;
  if (x > 120 && y > 60 && y < 175) return false;                 // conveyor & gate
  if (Math.hypot(x + 236, y - 186) < 44) return false;           // plaza
  if (x < -150 && y < -140) return false;                        // offices
  if (x > 170 && y < -120) return false;                         // solar
  if (y > 200 && x > -140 && x < 40) return false;               // parking
  return true;
};
s.forest({ size: [600, 500], count: 95, spacing: 13, seed: 9, kinds: ['tiered', 'round', 'pine'], minScale: 0.75, maxScale: 1.2, avoid: (x, y) => !free(x, y) });
s.cylinder({ at: [-236, 186, 0], r: 30, h: 3, chamfer: 1, rings: [22, 14] });
s.cylinder({ at: [-236, 186, 3], r: 8, h: 4, chamfer: 1 });
s.building({ at: [-238, -196, 0], w: 54, d: 40, h: 34, floors: 4, lit: 0.18, seed: 3, door: true });
s.building({ at: [-180, -222, 0], w: 34, d: 26, h: 22, floors: 3, lit: 0.1, seed: 8 });
for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) s.solar({ at: [206 + i * 26, -226 + j * 20, 0] });
s.rect({ at: [-128, 206, 0], size: [156, 42], r: 4, fill: 'f-road', line: 'ln-soft' });
for (let i = 1; i < 8; i++) s.line({ points: [[-128 + i * 19.5, 206, 0], [-128 + i * 19.5, 222, 0]], line: 'ln-faint' });
for (const i of [0, 2, 3, 6]) s.car({ at: [-118 + i * 19.5, 215, 0], rot: 90, length: 16, w: 9 });

/* conveyor out through the glass gate */
s.box({ at: [116, 96, 0], size: [26, 36, 26], r: 2, chamfer: 1, right: (f) => { f.rect(9, 9, 18, 17, { r: 1.5, fill: 'f-lit', line: null }); } , class: 'dock', glow: false });
const belt = s.conveyor({ id: 'belt', at: [262, 114, 0], length: 236, w: 16, h: 6 });
s.gate({ at: [330, 114, 6], axis: 'y', w: 40, h: 40 });
const shipped = [0, 1, 2].map((i) => s.phone({ id: 'shipped-' + i, class: 'phone', at: [150, 114, 6], w: 9, h: 18, screen: 'ui', facing: 'right' }));

/* phones on the roof, cards in the lane */
const N = 14, phones = [], wires = [];
for (let i = 0; i < N; i++) {
  const a = (360 * i) / N + 8, x = LANE * Math.cos(a * Math.PI / 180), y = LANE * Math.sin(a * Math.PI / 180);
  wires.push(s.line({ points: [[x, y, ROOF + 0.3], [x, y, ROOF + 2]], line: 'ln-strong', dash: '1.5 2.5', id: 'wire-' + i }));
  phones.push(Object.assign(s.phone({ id: 'phone-' + i, class: 'phone', at: [x, y, ROOF], stand: true, screen: R.pick(['ui', 'ui', 'dots']), w: 12, h: 25 }), { angle: a }));
}
const cards = [0, 1, 2].map((i) => s.card({ id: 'card-' + i, class: 'card', at: [LANE, 0, ROOF + 0.2], w: 15, d: 9 }));
const LAP = 16;
s.travel(cards, Iso.path.circle({ center: [0, 0, ROOF + 0.2], r: LANE }), { duration: LAP, orient: true, orientOffset: 90 });

/* when a card passes under a phone, the phone rises and a dotted wire joins them */
s.loop((t) => {
  phones.forEach((p, i) => {
    let b = 0;
    for (let j = 0; j < 3; j++) {
      const ca = ((t / LAP + j / 3) * 360) % 360;
      let d = Math.abs(((p.angle - ca + 540) % 360) - 180);
      if (d < 14) b = Math.max(b, 0.5 + 0.5 * Math.cos((Math.PI * d) / 14));
    }
    const lift = b * 24;
    p.set('z', lift);
    wires[i].set({ points: [[0, 0, 0], [0, 0, lift + 1.7]].map((q) => [LANE * Math.cos(p.angle * Math.PI / 180), LANE * Math.sin(p.angle * Math.PI / 180), ROOF + 0.3 + q[2]]), opacity: b > 0.02 ? b : 0 });
  });
});
s.travel(shipped, belt.track(0.2), { duration: 9 });
s.pulse('.dock', { min: 0.8, max: 1, period: 3 });

/* entrance: everything drops in, back to front */
s.assemble(s.root.items().filter((n) => n.prefab !== 'platform' && !/^card|^wire|^shipped/.test(n.id || '')), { stagger: 0.0045, drop: 26, duration: 0.7 });

s.timeline({ delay: 1.9 }).from(['card-*', 'shipped-*'], { opacity: 0 }, { duration: 0.6, stagger: 0.1 });

/* click to pause */
s.on('render', () => s.svg.addEventListener('click', () => { s.toggle(); s.status(s.playing ? 'live' : 'paused'); }));
</script>
</body>
</html>
