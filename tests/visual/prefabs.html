<!doctype html><html><head><meta charset="utf-8"><title>Prefabs</title>
<style>body{margin:0;background:#0c0d0e;padding:24px}</style></head><body>
<div id="app"></div>
<script src="../../dist/iso.js"></script>
<script>
const s = Iso.scene('#app', { figure: { index: 'Fig. 03', title: 'Prefabs', hint: 'Library overview', status: 'static' } });
s.platform({ size: [420, 300], label: 'Iso · prefab library · 2026', screws: true });
const X = (i) => -170 + i * 68, Y = (j) => -110 + j * 72;
s.tree({ at: [X(0), Y(0), 0], kind: 'tiered' });
s.tree({ at: [X(0) + 18, Y(0) + 10, 0], kind: 'pine' });
s.tree({ at: [X(0) + 4, Y(0) + 26, 0], kind: 'round' });
s.tree({ at: [X(0) + 24, Y(0) + 32, 0], kind: 'cone' });
s.phone({ at: [X(1), Y(0), 0], stand: true, screen: 'ui' });
s.phone({ at: [X(1) + 22, Y(0) + 8, 0], screen: 'lit', facing: 'right' });
s.card({ at: [X(1) + 10, Y(0) + 34, 0] });
s.laptop({ at: [X(2), Y(0), 0] });
s.monitor({ at: [X(3), Y(0), 0] });
s.server({ at: [X(4), Y(0), 0] });
s.database({ at: [X(5), Y(0), 0] });
s.chip({ at: [X(0) + 10, Y(1) + 10, 0], label: 'ISO' });
s.router({ at: [X(1) + 10, Y(1) + 10, 0] });
s.building({ at: [X(2) + 10, Y(1) + 10, 0], lit: 0.2, door: true });
s.tower({ at: [X(3) + 10, Y(1) + 10, 0] });
s.gate({ at: [X(4) + 10, Y(1) + 10, 0] });
s.block({ at: [X(5) + 10, Y(1) + 10, 0], icon: 'database', label: 'Postgres' });
s.conveyor({ at: [X(1) + 20, Y(2) + 10, 0], length: 110 });
s.stack({ at: [X(3) + 20, Y(2) + 10, 0], size: [60, 46], t: 5, gap: 10, layers: [{ label: 'Infra' }, { label: 'Data', icon: 'database' }, { label: 'App', material: 'lit', glow: true }] });
s.plant({ at: [X(5) + 10, Y(2) + 10, 0] });
s.lamp({ at: [X(5) + 34, Y(2) + 0, 0] });
s.pin({ at: [X(0) + 10, Y(2) + 10, 0], lit: true });
s.zone({ at: [X(0) + 10, Y(3) - 6, 0], size: [70, 30], label: 'zone' });
s.plaque({ at: [X(2) + 10, Y(3) - 6, 0], text: 'plaque' });
</script></body></html>
